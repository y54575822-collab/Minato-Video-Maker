version: '3.8'

services:
  minato:
    build: .
    container_name: minato-video-maker
    ports:
      - "5000:5000"
    environment:
      # LLM Configuration
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4o
      
      # Video Configuration
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      VIDEO_ORIENTATION: portrait
      VIDEO_DURATION_MINUTES: 5
      
      # Audio Configuration
      TTS_PROVIDER: edgetts
      STT_PROVIDER: whisper
      
      # AI Video Generation
      MUAPI_BASE_URL: https://api.muapi.ai
      MUAPI_API_KEY: ${MUAPI_API_KEY}
      MUAPI_VIDEO_MODEL: veo3-fast-text-to-video
      
      # Caption Configuration
      CAPTIONS_ENABLED: "true"
      CAPTION_FONT_SIZE: 100
      CAPTION_FONT_COLOR: white
      CAPTION_POSITION: bottom_center
      
      # Server Configuration
      FLASK_ENV: production
      DEBUG: "false"
    
    volumes:
      - ./videos:/app/videos
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

volumes:
  videos:
  logs:
